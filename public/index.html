<style>
:root{
  --green:#2FB81C; --green-d:#1E7D12; --green-l:#EAF8E7;
  --ink:#101311; --ink-2:#3A423C; --mut:#6B7568;
  --bg:#F6F8F4; --card:#FFFFFF; --line:#E4E9DF; --line-2:#EEF2EA;
  --warn:#E0A106; --danger:#D8412F; --info:#2F6DB8;
  --r:14px; --r-s:10px; --sh:0 1px 2px rgba(16,19,17,.05),0 8px 24px rgba(16,19,17,.05);
  --sh-lg:0 12px 40px rgba(16,19,17,.14);
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.hide{display:none!important}

/* ---------- Header ---------- */
.hd{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd-in{max-width:1240px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px}
.logo{height:38px;flex:none}
.hd-nav{display:flex;gap:6px;margin-left:6px}
.hd-nav button{padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2)}
.hd-nav button:hover{background:var(--line-2)}
.hd-nav button.on{background:var(--ink);color:#fff}
.hd-nav button.promo-nav{color:#e11d48;font-weight:700}
.hd-nav button.promo-nav:hover{background:#fdeaee}
.hd-sp{flex:1}
.hd-user{display:flex;align-items:center;gap:10px}
.who{text-align:right;line-height:1.15}
.who b{font-family:var(--disp);font-size:14px;display:block}
.who span{font-size:11.5px;color:var(--mut)}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.badge.cli{background:var(--green-l);color:var(--green-d)}
.badge.adm{background:#101311;color:#fff}
.badge.prev{background:#FFF3CD;color:#8A6D00;border:1px solid #F2D98A}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--green);color:#0a2b06;box-shadow:0 1px 0 var(--green-d)}
.btn.primary:hover{background:var(--green-d);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
.main{padding:26px 0 80px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0f130f 0%,#182016 60%,#12331a 100%);color:#fff;border-radius:24px;margin:24px 22px 0;padding:56px 48px}
.hero-max{max-width:1196px;margin:0 auto}
.hero .eyebrow{font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#9be08a;font-weight:600}
.hero h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4.4vw,54px);line-height:1.03;margin:14px 0 0;max-width:16ch;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{font-size:17px;color:#cfd8cd;max-width:52ch;margin:18px 0 26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-cta .btn.primary{padding:13px 22px;font-size:15px}
.hero-cta .btn.ghost{border-color:#3c4a3c;color:#eaf3e8;padding:13px 22px}
.hero-cta .btn.ghost:hover{border-color:#9be08a}
.stats{display:flex;gap:34px;margin-top:38px;flex-wrap:wrap}
.stat b{font-family:var(--disp);font-size:30px;display:block;color:#fff}
.stat span{font-size:13px;color:#9fae9c}
.arc{position:absolute;right:-120px;top:-80px;width:520px;height:520px;pointer-events:none;opacity:.9}
.arc svg{width:100%;height:100%}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;position:relative;z-index:1}
.hero-banner{background:#fff;border-radius:16px;padding:18px 22px;box-shadow:0 22px 55px rgba(0,0,0,.30)}
.hero-banner img{width:100%;height:auto;display:block;border-radius:4px}
.promo-band{margin:22px 0 0;background:linear-gradient(135deg,#fff 0%,#f2fbef 100%);border:1px solid var(--line);border-radius:20px;padding:22px 22px 24px;box-shadow:var(--sh)}
.promo-hd{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.promo-hd h2{font-family:var(--disp);font-size:24px;margin:0;display:flex;align-items:center;gap:9px}
.promo-hd h2::before{content:"★";color:var(--green)}
.promo-hd .sub{color:var(--mut);font-size:13.5px;margin-top:3px}
.promo-pill{background:var(--green);color:#fff;font-weight:700;font-size:12.5px;padding:6px 13px;border-radius:20px;white-space:nowrap}
.promo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.promo-card{cursor:pointer;position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;transition:.15s}
.promo-cta{margin-top:2px;font-size:12px;font-weight:700;color:var(--green-d,#1f8f16)}
#promozioni{scroll-margin-top:84px}
.promo-card:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.promo-tag{position:absolute;top:10px;right:10px;background:#e11d48;color:#fff;font-weight:800;font-size:11.5px;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.promo-img{height:120px;border-radius:10px;background:var(--line-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.promo-img img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.promo-img .noimg{font-size:34px;opacity:.5}
.promo-desc{font-size:13px;font-weight:600;line-height:1.32;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.promo-price{font-family:var(--disp);font-size:18px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.promo-price s{font-family:var(--sans);font-size:13px;color:var(--mut)}
.promo-price .mut{font-family:var(--sans);font-size:11px}
.promo-chip{background:#e11d48;color:#fff;font-weight:700;font-size:11px;padding:4px 10px;border-radius:20px;white-space:nowrap}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:26px}.hero h1{max-width:none}.hero p{max-width:none}}

/* ---------- Sector chips ---------- */
.sectors{display:flex;gap:9px;flex-wrap:wrap;margin:26px 0 6px}
.chip{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.15s}
.chip:hover{border-color:var(--green)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- Toolbar / filters ---------- */
.sect-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:34px 0 14px;flex-wrap:wrap}
.sect-title h2{font-family:var(--disp);font-size:24px;margin:0;letter-spacing:-.01em}
.sect-title .sub{color:var(--mut);font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
.search input{border:none;background:none;outline:none;width:100%}
.fsel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);font-weight:500}
.count{color:var(--mut);font-size:13.5px;white-space:nowrap;padding:0 4px}

/* ---------- Product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px;margin-top:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);transition:.18s}
.card-promo{position:absolute;top:10px;left:10px;z-index:2;background:#e11d48;color:#fff;font-weight:700;font-size:10.5px;padding:3px 9px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.card:hover{border-color:#cfd9c8;transform:translateY(-2px);box-shadow:var(--sh-lg)}
.card .cat{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d)}
.card h3{font-size:15px;font-weight:600;margin:0;line-height:1.3;min-height:38px}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .code{font-size:11.5px;color:var(--mut)}
.um{font-size:10.5px;font-weight:700;background:var(--line-2);color:var(--ink-2);padding:2px 7px;border-radius:6px;text-transform:uppercase}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;color:var(--mut);background:var(--bg);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.card .foot{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-family:var(--disp);font-weight:700;font-size:19px}
.price small{font-weight:500;font-size:12px;color:var(--mut)}
.locked{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12.5px;font-weight:500}
.locked svg{width:15px;height:15px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:30px;height:32px;font-size:17px;font-weight:600;color:var(--ink-2)}
.stepper button:hover{background:var(--line-2)}
.stepper input{width:42px;height:32px;border:none;text-align:center;border-left:1px solid var(--line);border-right:1px solid var(--line);outline:none}
.more{display:flex;justify-content:center;margin:30px 0}

/* ---------- Cart ---------- */
.cartbtn{position:fixed;right:22px;bottom:22px;z-index:45;background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-lg);font-weight:600}
.cartbtn .n{background:var(--green);color:#0a2b06;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.drawer-bg{position:fixed;inset:0;background:rgba(16,19,17,.42);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,94vw);background:#fff;z-index:61;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.drawer.open{transform:none}
.drawer-hd{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-hd h3{font-family:var(--disp);margin:0;font-size:19px}
.drawer-body{flex:1;overflow:auto;padding:8px 20px}
.citem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.citem .ci-main{flex:1;min-width:0}
.citem h4{margin:0 0 3px;font-size:13.5px;font-weight:600;line-height:1.3}
.citem .ci-sub{font-size:11.5px;color:var(--mut)}
.citem .ci-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.linkx{font-size:12px;color:var(--danger);font-weight:600}
.drawer-foot{padding:18px 20px;border-top:1px solid var(--line);background:var(--bg)}
.tot{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tot b{font-family:var(--disp);font-size:22px}
.note{font-size:12px;color:var(--mut);margin:6px 0 14px}
.empty{text-align:center;color:var(--mut);padding:60px 20px}
.empty svg{width:42px;height:42px;opacity:.4;margin-bottom:10px}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(16,19,17,.5);z-index:70;display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:.18s}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:20px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:var(--sh-lg);transform:translateY(8px) scale(.99);transition:.2s}
.modal.wide{width:min(920px,100%)}
.modal-bg.open .modal{transform:none}
.modal-hd{padding:24px 26px 6px}
.modal-hd h3{font-family:var(--disp);margin:0;font-size:22px}
.modal-hd p{color:var(--mut);font-size:14px;margin:6px 0 0}
.modal-body{padding:16px 26px 26px}
.x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.x:hover{background:var(--line-2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid #b4beae;border-radius:10px;background:#fcfdfb;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.field textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tin{border:1.5px solid #b4beae;border-radius:7px;padding:5px 7px;font:inherit;font-size:12.5px;max-width:100%;background:#fcfdfb}
.tin.right{text-align:right}
.hint{background:var(--green-l);border:1px solid #cdeec6;border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--green-d);margin-top:8px}
.hint b{font-weight:700}
.seg{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;z-index:90;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast .dot{width:9px;height:9px;border-radius:99px;background:var(--green)}

/* ---------- Admin / tables ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:6px 0 24px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.kpi b{font-family:var(--disp);font-size:32px;display:block;line-height:1}
.kpi span{font-size:13px;color:var(--mut)}
.kpi.hl{background:var(--ink);color:#fff}
.kpi.hl span{color:#a9b3a6}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.panel-hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-hd h3{font-family:var(--disp);font-size:18px;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:hover td{background:#fbfdfa}
.st{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.st.nuovo{background:#e7f0fb;color:#2f6db8}
.st.lav{background:#fdf3d9;color:#a67c05}
.st.evaso{background:var(--green-l);color:var(--green-d)}
.st.ann{background:#fbe7e4;color:var(--danger)}
.st.aperta{background:#fdf3d9;color:#a67c05}
.st.gestita{background:var(--green-l);color:var(--green-d)}
.ordrow-x{background:#fbfdfa}
.itemline{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--line-2)}
.pubtog{width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;transition:.15s;flex:none}
.pubtog::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:99px;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pubtog.on{background:var(--green)}
.pubtog.promo.on{background:#e11d48}
.pubtog.on::after{left:19px}
.promo-edit{background:#fff5f6;border:1px solid #f6d4da;border-radius:12px;padding:13px 15px;margin-bottom:14px}
.priceedit{width:82px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right;font-family:var(--disp)}
.mgn{font-weight:700;font-size:12.5px}
.mgn.lo{color:var(--danger)}
.tbl-scroll{max-height:560px;overflow:auto}
.mut{color:var(--mut)}
.center{text-align:center}
.right{text-align:right}

/* about strip */
.about{margin-top:46px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;display:grid;grid-template-columns:1.2fr 1fr;gap:34px;box-shadow:var(--sh)}
.about h2{font-family:var(--disp);font-size:26px;margin:0 0 12px}
.about p{color:var(--ink-2);margin:0 0 12px;max-width:55ch}
.about .cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ftr{border-top:1px solid var(--line);margin-top:60px;padding:30px 0;color:var(--mut);font-size:13px}
.ftr .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:center}

@media(max-width:820px){
 .hero{padding:40px 26px;margin:16px 14px 0}
 .about{grid-template-columns:1fr}
 .hd-nav{display:none}
 .who span{display:none}
 .arc{display:none}
 .wrap{padding:0 14px}
}
@media print{.hd,.cartbtn,.ftr,.sect-title button,.modal-bg,.drawer,.drawer-bg{display:none!important}.panel{box-shadow:none;border-color:#ccc}.main{padding:0}body{background:#fff}}
.tbl-edit td{vertical-align:middle}
.wrap.wide{max-width:none;padding:0 16px}
.wrap.wide .tbl-scroll{max-height:calc(100vh - 250px)}
.wrap.wide .tbl-edit{min-width:1080px}
.wrap.wide .tbl{font-size:12px}
.wrap.wide .tbl th{padding:8px 9px;font-size:10px}
.wrap.wide .tbl td{padding:6px 9px}
.wrap.wide .tbl-edit .cellinput{font-size:12px;padding:5px 7px}
.wrap.wide .tbl-edit .priceedit{font-size:12px;padding:5px 6px}
.wrap.wide .tbl-edit .cellsel{font-size:11.5px;padding:5px 6px}
.cellinput{width:100%;min-width:210px;padding:6px 8px;border:1.5px solid #b4beae;border-radius:7px;font:inherit;font-size:12.5px;background:#fcfdfb;color:var(--ink)}
.cellinput:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(47,184,28,.12)}
.cellsel{padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;font:inherit;font-size:12.5px;background:#fff;color:var(--ink);max-width:180px;cursor:pointer}
.cellsel:focus{outline:none;border-color:var(--green)}
.qresults{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin-bottom:12px}
.qres{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;cursor:pointer;font-size:13px;border-top:1px solid var(--line-2)}
.qres:first-child{border-top:0}
.qres:hover{background:var(--line)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.barwrap{padding:14px 18px}
.barrow{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.barlab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.bartrack{background:var(--line);border-radius:6px;height:12px;overflow:hidden}
.barfill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-d));border-radius:6px;min-width:2px}
.barval{font-weight:700;white-space:nowrap}
.chartbars{display:flex;align-items:flex-end;gap:8px;height:172px;padding:18px 18px 12px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cb-bar{width:70%;max-width:34px;background:linear-gradient(180deg,var(--green),var(--green-d));border-radius:5px 5px 0 0;min-height:2px}
.cb-lab{font-size:10.5px;color:var(--mut);margin-top:6px}
@media(max-width:760px){.statgrid{grid-template-columns:1fr}}
.st.spd{background:#e6f0ff;color:#1e5fd0}
.st.inv{background:#efe7ff;color:#6b3fd0}
.prog{display:flex;align-items:flex-start;gap:0;flex-wrap:nowrap}
.pstep{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.pstep:not(:first-child)::before{content:"";position:absolute;top:12px;left:-50%;width:100%;height:3px;background:var(--line-2)}
.pstep.done:not(:first-child)::before,.pstep.now:not(:first-child)::before{background:var(--green)}
.pdot{width:26px;height:26px;border-radius:50%;background:var(--line-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative;z-index:1}
.pstep.done .pdot{background:var(--green)}
.pstep.now .pdot{background:var(--green-d);box-shadow:0 0 0 4px rgba(47,184,28,.18)}
.plab{font-size:10.5px;margin-top:5px;text-align:center;color:var(--mut);line-height:1.2}
.pstep.now .plab{color:var(--ink);font-weight:700}
.progcanc{font-size:13px;font-weight:700;color:var(--danger);background:#fdecec;border-radius:8px;padding:8px 12px;text-align:center}
.dcard{background:var(--line);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.7;margin-bottom:6px}
.dsub{font-family:var(--disp);font-size:14px;margin:18px 0 8px;color:var(--ink)}
.drow{border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;margin-bottom:7px}
.drow-t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.attsec{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.attcol{background:var(--line);border-radius:10px;padding:10px 12px}
.attlab{font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:8px}
.attrow{display:flex;align-items:center;gap:6px}
@media(max-width:620px){.attsec{grid-template-columns:1fr}}
.cardimg{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--line);margin-bottom:12px}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block}
.imgrow{display:flex;align-items:center;gap:10px}
.imgthumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line-2);background:var(--line)}
.lthumb{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line-2);flex:none;display:inline-block;vertical-align:middle}
.lthumb.ph{background:var(--line)}
.dscb{display:inline-block;background:#e9f8e6;color:#1f8f16;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;vertical-align:middle}
.celldesc{display:flex;align-items:center;gap:9px}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <img class="logo" id="logo" src="/assets/logo.png" alt="ZETAPACK Srl">
    <nav class="hd-nav" id="nav"></nav>
    <div class="hd-sp"></div>
    <div class="hd-user" id="userbox"></div>
  </div>
</header>

<main id="app"><div class="wrap main"><div class="empty">Caricamento…</div></div></main>

<button class="cartbtn hide" id="cartbtn" onclick="openCart()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
  <span>Richiesta</span><span class="n" id="cartn">0</span>
</button>
<div class="drawer-bg" id="drawerbg" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-hd"><h3>Richiesta ordine</h3><button class="x" style="position:static" onclick="closeCart()">✕</button></div>
  <div class="drawer-body" id="cartbody"></div>
  <div class="drawer-foot" id="cartfoot"></div>
</aside>

<div class="modal-bg" id="modalbg">
  <div class="modal" style="position:relative">
    <button class="x" onclick="closeModal()">✕</button>
    <div id="modalcontent"></div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastmsg"></span></div>

<script>
const APP_VERSION = "6.3.5";
const BUILD_DATE  = "13 novembre 2026";

/* ---------------- API layer ---------------- */
function tokenGet(){ try{ return localStorage.getItem('zp_token'); }catch(e){ return null; } }
function sessionSave(t,u){ try{ localStorage.setItem('zp_token',t); localStorage.setItem('zp_user',JSON.stringify(u)); }catch(e){} }
function sessionClear(){ try{ localStorage.removeItem('zp_token'); localStorage.removeItem('zp_user'); }catch(e){} }
function sessionUser(){ try{ return JSON.parse(localStorage.getItem('zp_user')||'null'); }catch(e){ return null; } }

async function api(path, opts={}){
  const h = { 'Content-Type':'application/json' };
  const t = tokenGet(); if(t) h['Authorization']='Bearer '+t;
  const res = await fetch(path, { method:opts.method||'GET', headers:h, body:opts.body?JSON.stringify(opts.body):undefined });
  if(res.status===401){ sessionClear(); }
  if(opts.raw) return res;
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'Errore di rete');
  return data;
}
async function apiBlob(path){
  const h = {}; const t=tokenGet(); if(t) h['Authorization']='Bearer '+t;
  const res = await fetch(path,{headers:h});
  if(!res.ok) throw new Error('Errore nel download');
  return res.blob();
}

/* ---------------- State ---------------- */
const state = {
  view:'public', tab:'', user:null, preview:null,
  meta:{categories:[],sectors:[]}, catalog:[], promo:[],
  filter:{q:'',cat:'',sector:''}, page:1, perPage:48, cart:{},
  myOrders:[], adminOrders:[], adminRequests:[], adminClients:[], adminProducts:[], adminQuotes:[], adminLogs:[],
  adminOrderFilter:'', adminListinoQ:'', openOrder:null, quoteFilter:'', statsPeriod:'all', logFilter:'',
  listinoView:'all', listinoCat:'', listinoSup:'', listinoSec:''
};

function money(n){ return (n==null)?'—':Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- Init ---------------- */
async function init(){
  try{
    const [meta, catalog, promo] = await Promise.all([api('/api/meta'), api('/api/catalog'), api('/api/promo').catch(()=>[])]);
    state.meta=meta; state.catalog=catalog; state.promo=promo||[];
  }catch(e){ document.getElementById('app').innerHTML=`<div class="wrap main"><div class="empty">Server non raggiungibile. Avvia il backend e ricarica.</div></div>`; return; }
  const u = sessionUser();
  if(u && tokenGet()){
    state.user=u;
    if(u.role==='admin'){ state.view='admin'; state.tab='dash'; await loadAdmin(); }
    else { state.view='client'; state.tab='cat'; await loadClient(); }
  }
  render();
  if(!state.user) track('Visita catalogo');
}
async function loadClient(){
  try{
    const [cat, ord] = await Promise.all([api('/api/catalog/prices'), api('/api/orders/mine')]);
    state.catalog=cat; state.myOrders=ord;
  }catch(e){ toast(e.message); logout(); }
}
function track(event, detail){ try{ api('/api/track',{method:'POST',body:{event:event||'',detail:detail||'',ref:document.referrer||''}}).catch(()=>{}); }catch(e){} }
async function loadAdmin(){
  try{
    const [ord, req, cli, prod, quo, logs] = await Promise.all([
      api('/api/admin/orders'), api('/api/admin/requests'), api('/api/admin/clients'), api('/api/admin/products'), api('/api/admin/quotes'), api('/api/admin/logs').catch(()=>[])
    ]);
    state.adminOrders=ord; state.adminRequests=req; state.adminClients=cli; state.adminProducts=prod; state.adminQuotes=quo; state.adminLogs=logs||[];
  }catch(e){ toast(e.message); }
}
async function reloadLogs(){ try{ state.adminLogs=await api('/api/admin/logs'); render(); toast('Log aggiornati'); }catch(e){ toast(e.message); } }

/* ---------------- Header ---------------- */
function renderHeader(){
  const nav=document.getElementById('nav'), ub=document.getElementById('userbox');
  if(state.view==='public'){
    nav.innerHTML=`<button class="on" onclick="goPublicCatalog()">Catalogo</button>${(state.promo&&state.promo.length)?`<button class="promo-nav" onclick="goPublicPromo()">★ Promozioni</button>`:''}`;
    if(state.preview){
      ub.innerHTML=`<span class="badge prev">👁 Anteprima: visitatore non loggato</span>
        <button class="btn primary sm" onclick="exitPreview()">↩ Torna all'amministrazione</button>`;
    } else {
      ub.innerHTML=`<button class="btn ghost sm" onclick="openLogin()">Accedi</button>
        <button class="btn primary sm" onclick="openRequest()">Richiedi accesso</button>`;
    }
  } else if(state.view==='client'){
    nav.innerHTML=`<button class="${state.tab==='cat'?'on':''}" onclick="setTab('cat')">Catalogo & prezzi</button>
      ${state.preview?'':`<button class="${state.tab==='ord'?'on':''}" onclick="setTab('ord')">I miei ordini</button>`}`;
    if(state.preview){
      ub.innerHTML=`<span class="badge prev">👁 Anteprima: cliente registrato</span>
        <button class="btn primary sm" onclick="exitPreview()">↩ Torna all'amministrazione</button>`;
    } else {
      ub.innerHTML=`<div class="who"><b>${esc(state.user.name)}</b><span>${esc(state.user.id||'')} · ${esc(state.user.city||'')}</span></div>
        <span class="badge cli">Cliente</span><button class="btn ghost sm" onclick="logout()">Esci</button>`;
    }
  } else {
    nav.innerHTML=`
      <button class="${state.tab==='dash'?'on':''}" onclick="setTab('dash')">Dashboard</button>
      <button class="${state.tab==='ord'?'on':''}" onclick="setTab('ord')">Ordini</button>
      <button class="${state.tab==='quo'?'on':''}" onclick="setTab('quo')">Preventivi</button>
      <button class="${state.tab==='stat'?'on':''}" onclick="setTab('stat')">Statistiche</button>
      <button class="${state.tab==='req'?'on':''}" onclick="setTab('req')">Richieste</button>
      <button class="${state.tab==='cli'?'on':''}" onclick="setTab('cli')">Clienti</button>
      <button class="${state.tab==='lst'?'on':''}" onclick="setTab('lst')">Listino</button>
      <button class="${state.tab==='fatt'?'on':''}" onclick="setTab('fatt')">Fatturazione</button>
      <button class="${state.tab==='mag'?'on':''}" onclick="setTab('mag')">Magazzino</button>
      <button class="${state.tab==='forn'?'on':''}" onclick="setTab('forn')">Fornitori</button>
      <button class="${state.tab==='road'?'on':''}" onclick="setTab('road')">Avanzamento</button>
      <button class="${state.tab==='guide'?'on':''}" onclick="setTab('guide')">Guida</button>`;
    ub.innerHTML=`<div class="who"><b>ZETAPACK Srl</b><span>Pannello gestione · v${APP_VERSION}</span></div>
      <button class="btn ghost sm" onclick="previewAs('public')" title="Vedi il sito come un visitatore non registrato">👁 Vista pubblico</button>
      <button class="btn ghost sm" onclick="previewAs('client')" title="Vedi il sito come un cliente registrato">👁 Vista cliente</button>
      <span class="badge adm">Azienda</span><button class="btn ghost sm" onclick="logout()">Esci</button>`;
  }
  document.getElementById('cartbtn').classList.toggle('hide', !(state.view==='client'&&state.tab==='cat'));
}

/* ---------------- Router ---------------- */
function render(){
  renderHeader();
  const app=document.getElementById('app');
  if(state.view==='public') app.innerHTML=viewPublic();
  else if(state.view==='client') app.innerHTML=viewClient();
  else app.innerHTML=viewAdmin();
  updateCartBtn();
}
async function setTab(t){
  state.tab=t; state.page=1;
  if(state.view==='client'&&t==='ord'&&!state.preview){ state.myOrders=await api('/api/orders/mine'); }
  if(state.view==='admin'&&t==='fatt'){ try{ state.company=await api('/api/admin/company'); state.invoices=await api('/api/admin/invoices'); }catch(e){} }
  if(state.view==='admin'&&t==='mag'){ try{ state.warehouse=await api('/api/admin/warehouse'); state.suppliers=await api('/api/admin/suppliers'); }catch(e){} }
  if(state.view==='admin'&&t==='forn'){ try{ state.suppliers=await api('/api/admin/suppliers'); }catch(e){} }
  render();
  if(state.view==='client') track(t==='ord'?'I miei ordini':'Catalogo & prezzi');
}
function goPublicCatalog(){ state.filter={q:'',cat:'',sector:''}; state.page=1; render(); setTimeout(()=>document.getElementById('catalog')?.scrollIntoView({behavior:'smooth'}),40); }
function goPublicPromo(){ document.getElementById('promozioni')?.scrollIntoView({behavior:'smooth',block:'start'}); }

/* ---------------- Filters + grid ---------------- */
const CATS=()=>state.meta.categories, SECTORS=()=>state.meta.sectors;
function filtered(){
  const {q,cat,sector}=state.filter, ql=q.toLowerCase();
  return state.catalog
    .filter(p=>!cat||p.category===cat)
    .filter(p=>!sector||(p.tags||[]).includes(sector))
    .filter(p=>!ql||p.descr.toLowerCase().includes(ql)||p.code.toLowerCase().includes(ql));
}
function filtersBar(){
  return `<div class="filters">
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Cerca prodotto o codice…" value="${esc(state.filter.q)}" oninput="state.filter.q=this.value;debouncedGrid()"></div>
    <select class="fsel" onchange="state.filter.cat=this.value;state.page=1;render()">
      <option value="">Tutte le categorie</option>
      ${CATS().map(c=>`<option ${state.filter.cat===c?'selected':''}>${esc(c)}</option>`).join('')}
    </select>
    <span class="count" id="rescount"></span>
  </div>`;
}
function sectorChips(){
  return `<div class="sectors">
    <button class="chip ${state.filter.sector===''?'on':''}" onclick="setSector('')">Tutti i settori</button>
    ${SECTORS().map(s=>`<button class="chip ${state.filter.sector===s?'on':''}" onclick="setSector('${esc(s)}')">${esc(s)}</button>`).join('')}
  </div>`;
}
function setSector(s){ state.filter.sector=(state.filter.sector===s?'':s); state.page=1; render(); }
let gridT; function debouncedGrid(){ clearTimeout(gridT); gridT=setTimeout(()=>{state.page=1;render();},220); }

function grid(withPrice){
  const list=filtered();
  const shown=list.slice(0,state.page*state.perPage);
  const cards=shown.map(p=>card(p,withPrice)).join('');
  const more=list.length>shown.length?`<div class="more"><button class="btn ghost" onclick="state.page++;render()">Mostra altri prodotti (${list.length-shown.length})</button></div>`:'';
  const empty=list.length?'':`<div class="panel"><div class="empty">Nessun prodotto trovato.</div></div>`;
  setTimeout(()=>{const c=document.getElementById('rescount'); if(c)c.textContent=list.length+' prodotti';},0);
  return `<div class="grid">${cards}</div>${more}${empty}`;
}
function card(p,withPrice){
  const tags=(p.tags||[]).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+((p.tags||[]).length>2?`<span class="tag">+${p.tags.length-2}</span>`:'');
  let foot;
  if(!withPrice){
    if(p.promo && p.price!=null){
      const hasP=p.promo_price!=null&&p.promo_price>0&&p.promo_price<p.price;
      const shown=hasP?p.promo_price:p.price;
      foot=`<div class="price">${money(shown)} ${hasP?`<s class="mut" style="font-size:12px;font-weight:400">${money(p.price)}</s> `:''}<small>/ ${esc(p.um)}</small></div><button class="btn primary sm" onclick="openRequest()">Iscriviti</button>`;
    } else {
      foot=`<div class="locked"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Prezzo riservato</span></div>
      <button class="btn ghost sm" onclick="openLogin()">Accedi</button>`;
    }
  } else {
    const q=state.cart[p.code]||0;
    foot=`<div class="price">${money(p.price)} <small>/ ${esc(p.um)}</small></div>`;
    foot+= q>0
      ? `<div class="stepper"><button onclick="setQty('${esc(p.code)}',${q-1})">−</button><input value="${q}" onchange="setQty('${esc(p.code)}',this.value)"><button onclick="setQty('${esc(p.code)}',${q+1})">+</button></div>`
      : `<button class="btn primary sm" onclick="setQty('${esc(p.code)}',${p.minq||1})">Aggiungi</button>`;
  }
  const img=`<div class="cardimg">${prodImgTag(p,'',p.descr)}</div>`;
  return `<div class="card">${p.promo&&!withPrice?'<span class="card-promo">★ Promo</span>':''}${img}<div class="cat">${esc(p.category)}</div><h3>${esc(p.descr)}</h3>
    <div class="meta"><span class="code mono">${esc(p.code)}</span><span class="um">${esc(p.um)}</span></div>
    <div class="tags">${tags}</div><div class="foot">${foot}</div></div>`;
}

/* ---------------- Public view ---------------- */
function viewPublic(){
  return `
  <div class="hero"><div class="arc"><svg viewBox="0 0 200 200"><path d="M20 180 A130 130 0 0 1 180 20" fill="none" stroke="#2FB81C" stroke-width="10" stroke-linecap="round"/><path d="M45 185 A150 150 0 0 1 185 45" fill="none" stroke="#2FB81C" stroke-width="4" opacity=".5" stroke-linecap="round"/></svg></div>
    <div class="hero-max hero-grid">
      <div class="hero-banner"><img src="/assets/banner-central.png" alt="ZETAPACK Srl — prodotti monouso, packaging e igiene professionale"></div>
      <div class="hero-copy">
      <div class="eyebrow">Imballaggi & Monouso · Verona e Rovereto</div>
      <h1>Imballaggi e monouso per <em>la tua attività</em>.</h1>
      <p>Un unico fornitore per bar, ristoranti, pizzerie, macellerie, panifici, alimentari e market nella zona di Verona e Rovereto. Monouso in carta, plastica, alluminio, legno e bio, packaging alimentare, pulizia e igiene professionale — anche personalizzati col tuo marchio. I clienti registrati vedono i prezzi dedicati e inviano le richieste d'ordine in pochi clic.</p>
      <div class="hero-cta"><button class="btn primary" onclick="openRequest()">Richiedi accesso / listino</button>
        <button class="btn ghost" onclick="openLogin()">Sono già cliente — accedi</button></div>
      <div class="stats">
        <div class="stat"><b>${state.catalog.length}</b><span>Prodotti pubblicati</span></div>
        <div class="stat"><b>${CATS().length}</b><span>Categorie</span></div>
        <div class="stat"><b>${SECTORS().length}</b><span>Settori serviti</span></div>
      </div>
      </div>
    </div></div>
  ${promoSection()}
  <div class="wrap main" id="catalog">
    ${sectorChips()}
    <div class="sect-title"><div><h2>Catalogo imballaggi e monouso</h2><div class="sub">Sfoglia liberamente tutto il catalogo. I prezzi sono riservati ai clienti registrati: richiedi l'accesso o il listino, è gratuito e senza impegno.</div></div></div>
    ${filtersBar()}${grid(false)}
  </div>${footer()}`;
}
function promoSection(){
  const list=state.promo||[];
  if(!list.length) return '';
  return `<div class="wrap" id="promozioni"><div class="promo-band">
    <div class="promo-hd"><div><h2>Prodotti in promozione</h2><div class="sub">Offerte del momento — prezzo visibile a tutti. Per ordinare, iscriviti gratuitamente.</div></div><span class="promo-pill">${list.length} in offerta</span></div>
    <div class="promo-grid">${list.map(promoCard).join('')}</div>
  </div></div>`;
}
function promoCard(p){
  const hasP=p.promo_price!=null&&p.promo_price>0&&p.promo_price<p.price;
  const shown=hasP?p.promo_price:p.price;
  const pct=hasP?Math.round((1-p.promo_price/p.price)*100):0;
  return `<div class="promo-card" onclick="openRequest()" title="Iscriviti per ordinare questo prodotto">
    <span class="promo-tag">${hasP?'−'+pct+'%':'Promo'}</span>
    <div class="promo-img">${prodImgTag(p,'',p.descr)||'<span class="noimg">📦</span>'}</div>
    <div class="promo-desc">${esc(p.descr)}</div>

/* ---------------- Cart ---------------- */
function setQty(code,q){ q=Math.max(0,Math.round(Number(q)||0)); if(q<=0) delete state.cart[code]; else state.cart[code]=q; render(); if(document.getElementById('drawer').classList.contains('open')) renderCart(); }
function updateCartBtn(){ const n=Object.values(state.cart).reduce((a,b)=>a+b,0); const el=document.getElementById('cartn'); if(el)el.textContent=n; }
function cartLines(){ return Object.entries(state.cart).map(([c,q])=>{ const p=state.catalog.find(x=>x.code===c)||{code:c,descr:c,price:0,um:''}; return {code:c,descr:p.descr,um:p.um,price:p.price||0,qty:q,sub:(p.price||0)*q}; }); }
function openCart(){ renderCart(); document.getElementById('drawerbg').classList.add('open'); document.getElementById('drawer').classList.add('open'); }
function closeCart(){ document.getElementById('drawerbg').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }
function renderCart(){
  const lines=cartLines(), body=document.getElementById('cartbody'), foot=document.getElementById('cartfoot');
  if(!lines.length){ body.innerHTML=`<div class="empty">La tua richiesta è vuota.</div>`; foot.innerHTML=''; return; }
  body.innerHTML=lines.map(l=>`<div class="citem"><div class="ci-main">
    <h4>${esc(l.descr)}</h4><div class="ci-sub mono">${esc(l.code)} · ${money(l.price)}/${esc(l.um)}</div>
    <div class="ci-row"><div class="stepper"><button onclick="setQty('${esc(l.code)}',${l.qty-1})">−</button><input value="${l.qty}" onchange="setQty('${esc(l.code)}',this.value)"><button onclick="setQty('${esc(l.code)}',${l.qty+1})">+</button></div><b>${money(l.sub)}</b></div>
    <button class="linkx" onclick="setQty('${esc(l.code)}',0)">Rimuovi</button></div></div>`).join('');
  const tot=lines.reduce((s,l)=>s+l.sub,0);
  foot.innerHTML=`<div class="tot"><span>Totale indicativo</span><b>${money(tot)}</b></div>
    <div class="note">Nessun pagamento richiesto. Invii una <b>richiesta d'ordine</b>: ZETAPACK la riceve e ti conferma.</div>
    <div class="field" style="margin-bottom:12px"><label>Nota per ZETAPACK (facoltativa)</label><textarea id="ordernote" style="min-height:60px"></textarea></div>
    <button class="btn primary" style="width:100%;justify-content:center;padding:13px" onclick="submitOrder()">Invia richiesta d'ordine</button>`;
}
async function submitOrder(){
  if(state.preview){ toast('Anteprima: l’invio dell’ordine è disattivato'); return; }
  const lines=cartLines(); if(!lines.length) return;
  const note=document.getElementById('ordernote')?.value||'';
  try{
    const order=await api('/api/orders',{method:'POST',body:{items:lines.map(l=>({code:l.code,qty:l.qty})),note}});
    state.cart={}; closeCart(); state.myOrders=await api('/api/orders/mine'); render();
    toast('Richiesta '+order.id+' inviata a ZETAPACK ✓');
  }catch(e){ toast(e.message); }
}
function replicate(id){ const o=state.myOrders.find(x=>x.id===id); if(!o) return; state.cart={}; o.items.forEach(it=>state.cart[it.code]=it.qty); setTab('cat'); track('Replica ordine', id); toast('Ordine '+id+' caricato nel carrello'); setTimeout(openCart,220); }
async function downloadPdf(id){ try{ const b=await apiBlob('/api/orders/'+id+'/pdf'); window.open(URL.createObjectURL(b),'_blank'); if(state.user&&state.user.role==='client') track('Download PDF', id); }catch(e){ toast(e.message); } }

function unitSuggest(it){
  if(it.unit!=null&&it.unit!=='') return it.unit;
  if(it.price>0 && it.sconti && it.sconti.length){ let f=1; it.sconti.forEach(s=>{const n=Number(s); if(!isNaN(n)) f*=(1-n/100);}); return Math.round(it.price*f*10000)/10000; }
  return it.qty?Math.round(it.total/it.qty*10000)/10000:(it.price||0);
}
function recalcUnit(i){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const price=parseFloat(g('pi_price_'+i).replace(',','.'));
  let f=1, any=false;
  ['pi_sc1_','pi_sc2_','pi_sc3_'].forEach(p=>{const v=g(p+i); if(v!==''){const n=parseFloat(v.replace(',','.')); if(!isNaN(n)){ f*=(1-n/100); any=true; }}});
  const u=document.getElementById('pi_unit_'+i); if(!u) return;
  if(!isNaN(price)&&price>0&&any) u.value=Math.round(price*f*10000)/10000;
  else if(!isNaN(price)&&price>0&&!any) u.value=Math.round(price*10000)/10000;
}

function fileToB64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(new Error('Lettura file non riuscita')); r.readAsDataURL(f); }); }
function pickOrderFile(id,kind){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.pdf,.jpg,.jpeg,.png,.gif,.webp';
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    if(f.size>12*1024*1024){ toast('File troppo grande (max 12 MB)'); return; }
    toast('Caricamento…');
    try{ const data=await fileToB64(f);
      const r=await api('/api/admin/orders/'+encodeURIComponent(id)+'/upload',{method:'POST',body:{kind,filename:f.name,data}});
      if(r&&r.demoTooBig){ toast('Nella demo locale il file supera lo spazio disponibile: usa un file più piccolo (sul sito reale il limite è 12 MB).'); return; }
      state.adminOrders=await api('/api/admin/orders'); openOrderProgress(id); toast('Allegato caricato ✓');
    }catch(e){ toast('Caricamento non riuscito: '+e.message); } };
  inp.click();
}

function downloadOrderFile(id,kind,side){

let OD=null;
function openOrderEditor(id){
  const o=state.adminOrders.find(x=>x.id===id); if(!o) return;
  OD={id:o.id, client_name:o.client_name, note:o.note||'', search:'',
    items:o.items.map(it=>{ const list=(it.list!=null?it.list:it.price)||0; const disc=Number(it.disc)||0; const price=(it.price!=null?it.price:Math.round(list*(1-disc/100)*100)/100); return {code:it.code,descr:it.descr,qty:it.qty,list,disc,price}; })};
  openModal('', true); renderOrderEditor();

function orderResults(){
  const s=OD.search.trim().toLowerCase(); if(!s) return '';
  const res=state.adminProducts.filter(p=>p.code.toLowerCase().includes(s)||p.descr.toLowerCase().includes(s)).slice(0,7);
  if(!res.length) return '<div class="mut" style="font-size:12.5px;margin-bottom:10px">Nessun prodotto trovato.</div>';
  return '<div class="qresults">'+res.map(p=>`<div class="qres" onclick="orderAdd('${esc(p.code)}')"><span style="display:flex;align-items:center;gap:8px">${prodImgTag(p,"lthumb")}<span><b>${esc(p.descr)}</b> <span class="mut mono">${esc(p.code)}</span></span></span><span>${money(p.price)}</span></div>`).join('')+'</div>';
}
function orderAdd(code){ const p=state.adminProducts.find(x=>x.code===code); if(!p) return; const ex=OD.items.find(it=>it.code===code); if(ex) ex.qty+=1; else { const lp=p.price!=null?p.price:0; OD.items.push({code:p.code,descr:p.descr,qty:p.minq||1,list:lp,disc:0,price:lp}); } renderOrderEditor(); }
function odSetQty(i,v){ OD.items[i].qty=Math.max(1,Math.round(Number(v)||1)); renderOrderEditor(); }
function odSetList(i,v){ const L=Math.max(0,Number(v)||0); OD.items[i].list=L; OD.items[i].price=Math.round(L*(1-OD.items[i].disc/100)*100)/100; renderOrderEditor(); }
function odSetDisc(i,v){ let d=Number(v)||0; if(d<0)d=0; if(d>100)d=100; OD.items[i].disc=d; OD.items[i].price=Math.round(OD.items[i].list*(1-d/100)*100)/100; renderOrderEditor(); }
function odSetNet(i,v){ let net=Math.max(0,Number(v)||0); OD.items[i].price=net; const L=OD.items[i].list||0; OD.items[i].disc=L>0?Math.max(0,Math.round((1-net/L)*1000)/10):0; renderOrderEditor(); }
function odApplyAll(){ let d=Number(document.getElementById('od_all').value)||0; if(d<0)d=0; if(d>100)d=100; OD.items.forEach(it=>{ it.disc=d; it.price=Math.round(it.list*(1-d/100)*100)/100; }); renderOrderEditor(); }
function renderOrderEditor(){
  const total=OD.items.reduce((s,it)=>s+it.price*it.qty,0);
  const lordo=OD.items.reduce((s,it)=>s+it.list*it.qty,0);
  const risparmio=lordo-total;
  document.getElementById('modalcontent').innerHTML=`<div class="modal-hd"><h3>Modifica ordine ${OD.id}</h3><p>Adegua <b>quantità</b> e applica uno <b>sconto %</b> per ogni prodotto (o su tutte le righe). Cliente: ${esc(OD.client_name)}.</p></div>
    <div class="modal-body">
      <div class="field"><label>Aggiungi prodotti</label><input id="osearch" placeholder="Cerca codice o descrizione…" value="${esc(OD.search)}" oninput="OD.search=this.value;document.getElementById('oresults').innerHTML=orderResults()"></div>
      <div id="oresults">${orderResults()}</div>
      ${OD.items.length?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px"><span class="mut" style="font-size:12.5px">Sconto su tutte le righe:</span><input id="od_all" class="priceedit" style="width:70px" type="number" step="0.5" min="0" max="100" placeholder="%"><button class="btn ghost sm" onclick="odApplyAll()">Applica</button></div>
      <div class="tbl-scroll"><table class="tbl"><thead><tr><th>Prodotto</th><th class="right">Q.tà</th><th class="right">Listino €</th><th class="right">Sconto %</th><th class="right">Netto €</th><th class="right">Subtot.</th><th></th></tr></thead><tbody>
        ${OD.items.map((it,i)=>`<tr>
          <td><div class="celldesc">${thumbImg(it.code)}<div>${esc(it.descr)}<div class="mut mono" style="font-size:11px">${esc(it.code)}</div></div></div></td>
          <td class="right"><input class="priceedit" style="width:52px" type="number" min="1" value="${it.qty}" onchange="odSetQty(${i},this.value)"></td>
          <td class="right"><input class="priceedit" style="width:72px" type="number" step="0.01" min="0" value="${it.list}" onchange="odSetList(${i},this.value)"></td>
          <td class="right"><input class="priceedit" style="width:62px;${it.disc>0?'border-color:var(--green);font-weight:700':''}" type="number" step="0.5" min="0" max="100" value="${it.disc||0}" onchange="odSetDisc(${i},this.value)"></td>
          <td class="right"><input class="priceedit" style="width:72px" type="number" step="0.01" min="0" value="${it.price}" onchange="odSetNet(${i},this.value)"></td>
          <td class="right"><b>${money(it.qty*it.price)}</b></td>
          <td class="right"><button class="linkx" onclick="OD.items.splice(${i},1);renderOrderEditor()">Rimuovi</button></td>
        </tr>`).join('')}</tbody></table></div>`:'<div class="mut" style="font-size:12.5px;margin:6px 0">Nessun articolo: aggiungine almeno uno.</div>'}
      <div class="field" style="margin-top:12px"><label>Nota</label><textarea style="min-height:56px" oninput="OD.note=this.value">${esc(OD.note)}</textarea></div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 14px">
        <span class="mut">Nuovo totale</span><b style="font-family:var(--disp);font-size:20px">${money(total)}</b>
        ${risparmio>0.005?`<span class="mut" style="font-size:12.5px">(sconto totale ${money(risparmio)} su ${money(lordo)})</span>`:''}
      </div>
      <div id="oberr" style="color:var(--danger);font-size:13px;font-weight:600;margin-bottom:8px"></div>
      <button class="btn primary" style="width:100%;justify-content:center;padding:12px" onclick="saveOrderItems()">Salva modifiche</button>
    </div>`;
}
async function saveOrderItems(){
  if(!OD.items.length){ document.getElementById('oberr').textContent="L'ordine deve avere almeno un articolo."; return; }

function quoteDefaults(o){
  const cli=state.adminClients.find(x=>x.id===o.client_id)||{};

  const subject='Preventivo '+o.id+' — ZETAPACK Srl';
  const lines=o.items.map(it=>'- '+it.qty+' x '+it.descr+' ('+it.code+'): '+money(it.qty*it.price));
  const listBlock=o.items.length<=15?('\n'+lines.join('\n')+'\n'):'\n(Dettaglio completo nel PDF allegato)\n';
  const body=hello+',\n\n'+
    'in allegato trovate il preventivo '+o.id+' relativo alla vostra richiesta.\n'+listBlock+
    '\nTotale indicativo: '+money(o.total)+' (IVA esclusa).\n'+

    'Per accettare o per qualsiasi chiarimento restiamo a disposizione.\n\n'+
    'Cordiali saluti,\nZETAPACK Srl';

function genUsername(){
  let base=(document.getElementById('cf_name').value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,12);
  if(!base) base='cliente';
  return base+Math.floor(100+Math.random()*900);
}
function genPassword(){
  const cons='bcdfghjkmnpqrstvwxz', vow='aeiou', dig='23456789', pick=s=>s[Math.floor(Math.random()*s.length)];
  let w=''; for(let i=0;i<2;i++) w+=pick(cons)+pick(vow)+pick(cons)+pick(vow);
  return w.charAt(0).toUpperCase()+w.slice(1)+'-'+pick(dig)+pick(dig)+pick(dig);
}
function generateCreds(){
  document.getElementById('cf_user').value=genUsername();
  document.getElementById('cf_pass').value=genPassword();
  const e=document.getElementById('cferr'); if(e)e.textContent='';
  toast('Credenziali generate — salva o invia al cliente');
}

/* ---- Immagini prodotto automatiche: codice → codice fornitore → categoria ---- */
function slugCat(c){ return (c||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'altro'; }
function autoImgChain(p){
  if(!p) return [];
  const enc=s=>encodeURIComponent(String(s).trim());
  const safe=s=>String(s||'').trim().replace(/[\/\\\s]+/g,'_');   // nome file sicuro per codici con "/"
  const steps=[];
  const push=v=>{ if(v && steps.indexOf(v)<0) steps.push(v); };
  if(p.image) push(p.image);                                                // 1) foto caricata a mano (priorità)
  if(p.code){ push('/assets/products/'+enc(p.code)+'.png');                  // 2) foto per codice prodotto
              push('/assets/products/'+enc(safe(p.code))+'.png'); }
  if((p.supcode||'').trim()){ push('/assets/products/'+enc(p.supcode)+'.png'); // 3) per codice fornitore
              push('/assets/products/'+enc(safe(p.supcode))+'.png'); }
  const catSrc=(typeof window!=='undefined'&&window.__CATIMG&&window.__CATIMG[slugCat(p.category)])||('/assets/categories/'+slugCat(p.category)+'.png');
  steps.push(catSrc);                                                       // 4) fallback: immagine categoria
  return steps;
}
function imgFallback(el){
  let fb=el.getAttribute('data-fb')||'';
  if(fb){ const parts=fb.split('|'); const next=parts.shift(); el.setAttribute('data-fb',parts.join('|')); el.src=next; return; }
  el.onerror=null; const box=el.closest('.cardimg,.promo-img'); if(box){ box.style.display='none'; } else { el.style.visibility='hidden'; }
}
function prodImgTag(p, cls, alt){
  const chain=autoImgChain(p); if(!chain.length) return '';
  return `<img class="${cls||''}" src="${esc(chain[0])}" data-fb="${esc(chain.slice(1).join('|'))}" onerror="imgFallback(this)" loading="lazy" alt="${esc(alt||(p&&p.descr)||'')}">`;
}
function prodObj(code){ return (state.adminProducts||[]).find(x=>x.code===code) || (state.catalog||[]).find(x=>x.code===code) || {code}; }
function prodImage(code){ let p=(state.adminProducts||[]).find(x=>x.code===code); if(p&&p.image) return p.image; p=(state.catalog||[]).find(x=>x.code===code); return (p&&p.image)||''; }

function discBadge(it){ return (it&&it.disc>0)?` <span class="dscb">−${Math.round(it.disc*10)/10}%</span>`:''; }
function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url);
      let w=img.width, h=img.height;
      if(w>maxDim||h>maxDim){ if(w>=h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; } }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      const mime='image/jpeg', durl=cv.toDataURL(mime,quality);
      resolve({ data:durl.split(',')[1], filename:'img.jpg', mime });
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('File immagine non valido')); };
    img.src=url;
  });
}

function handleImportFile(input){
  const file=input.files[0]; if(!file) return; const name=file.name.toLowerCase();
  if(name.endsWith('.csv')){ const r=new FileReader(); r.onload=()=>{ document.getElementById('imptext').value=r.result; toast('CSV caricato: premi Importa dati'); }; r.readAsText(file,'utf-8'); return; }
  if(typeof XLSX==='undefined'){ document.getElementById('imperr').textContent='Lettura Excel non disponibile: usa un file CSV.'; return; }
  const r=new FileReader(); r.onload=e=>{ try{ const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; importRows(XLSX.utils.sheet_to_json(ws,{header:1,defval:''})); }catch(err){ document.getElementById('imperr').textContent='Errore nella lettura del file.'; } }; r.readAsArrayBuffer(file);
}
function importFromText(){ const t=document.getElementById('imptext').value; if(!t.trim()){ document.getElementById('imperr').textContent='Incolla dei dati o carica un file.'; return; } importRows(parseCSV(t)); }
function parseCSV(text){
  text=text.replace(/\r/g,'').trim(); if(!text) return [];
  const lines=text.split('\n').filter(l=>l.length);
  const delim=(lines[0].split(';').length>=lines[0].split(',').length)?';':',';
  return lines.map(line=>{ const out=[]; let cur='',q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(ch===delim&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(s=>s.trim()); });
}
async function importRows(rows){
  if(!rows||!rows.length){ document.getElementById('imperr').textContent='Nessun dato valido.'; return; }
  const mode=(document.querySelector('input[name=impmode]:checked')||{}).value||'upsert';
  const header=rows[0].map(x=>String(x).toLowerCase());
  const looksHeader=header.some(h=>h.includes('codice')||h.includes('descriz'));
  let idx,data;
  if(looksHeader){ const find=(...ks)=>header.findIndex(h=>ks.some(k=>h.includes(k)));
    idx={c:find('codice'),d:find('descriz'),u:find('u.m','um','unit'),k:find('acquist'),p:find('vendit','prezzo'),g:find('categor'),t:find('settor','tag'),s:find('forn'),m:find('minim'),pub:find('pubblic','caricare')}; data=rows.slice(1);
  } else { idx={c:0,d:1,u:2,s:4,k:5,p:6,pub:7,m:8,g:9,t:10}; data=rows; }
  const num=v=>{ v=String(v||'').replace(',','.').trim(); const n=parseFloat(v); return isNaN(n)?null:n; };
  const out=[];
  for(const r of data){ const get=i=>(i!=null&&i>=0&&i<r.length)?String(r[i]).trim():''; const c=get(idx.c); if(!c) continue;
    const pubRaw=get(idx.pub).toLowerCase();
    out.push({code:c,descr:get(idx.d)||c,um:get(idx.u)||'pz',category:get(idx.g)||'Altro',
      tags:get(idx.t)?get(idx.t).split(/[|,]/).map(s=>s.trim()).filter(Boolean):[],
      cost:num(get(idx.k)),price:num(get(idx.p)),supplier:get(idx.s),minq:num(get(idx.m))||1,
      published:(pubRaw==='si'||pubRaw==='sì'||pubRaw==='1'||pubRaw==='true'||pubRaw==='x')?1:0});
  }
  try{ const res=await api('/api/admin/products/import',{method:'POST',body:{rows:out,mode}});
    state.adminProducts=await api('/api/admin/products'); refreshCatalogSilently(); closeModal(); render();
    toast('Import completato: '+res.added+' nuovi, '+res.updated+' aggiornati'+(res.skipped?', '+res.skipped+' saltati':''));
  }catch(e){ document.getElementById('imperr').textContent=e.message; }
}

let QD=null;
function openQuoteBuilder(id){
  const mapItems=arr=>arr.map(it=>{ const list=(it.list!=null?it.list:it.price)||0; const disc=Number(it.disc)||0; const price=(it.price!=null?it.price:Math.round(list*(1-disc/100)*100)/100); return {code:it.code,descr:it.descr,qty:it.qty,list,disc,price}; });
  if(id){ const q=state.adminQuotes.find(x=>x.id===id); QD={id:q.id,client_id:q.client_id||'',client_name:q.client_name,to_email:q.to_email||'',note:q.note||'',validity:q.validity||30,items:mapItems(q.items),search:''}; }
  else QD={id:null,client_id:'',client_name:'',to_email:'',note:'',validity:30,items:[],search:''};
  openModal('', true); renderQuoteBuilder();
}
function buildQResults(){
  const s=QD.search.trim().toLowerCase(); if(!s) return '';
  const res=state.adminProducts.filter(p=>p.code.toLowerCase().includes(s)||p.descr.toLowerCase().includes(s)).slice(0,7);
  if(!res.length) return '<div class="mut" style="font-size:12.5px;margin-bottom:10px">Nessun prodotto trovato.</div>';
  return '<div class="qresults">'+res.map(p=>`<div class="qres" onclick="quoteAdd('${esc(p.code)}')"><span style="display:flex;align-items:center;gap:8px">${prodImgTag(p,"lthumb")}<span><b>${esc(p.descr)}</b> <span class="mut mono">${esc(p.code)}</span></span></span><span>${money(p.price)}</span></div>`).join('')+'</div>';
}
function qdSetQty(i,v){ QD.items[i].qty=Math.max(1,Math.round(Number(v)||1)); renderQuoteBuilder(); }
function qdSetList(i,v){ const L=Math.max(0,Number(v)||0); QD.items[i].list=L; QD.items[i].price=Math.round(L*(1-QD.items[i].disc/100)*100)/100; renderQuoteBuilder(); }
function qdSetDisc(i,v){ let d=Number(v)||0; if(d<0)d=0; if(d>100)d=100; QD.items[i].disc=d; QD.items[i].price=Math.round(QD.items[i].list*(1-d/100)*100)/100; renderQuoteBuilder(); }
function qdSetNet(i,v){ let net=Math.max(0,Number(v)||0); QD.items[i].price=net; const L=QD.items[i].list||0; QD.items[i].disc=L>0?Math.max(0,Math.round((1-net/L)*1000)/10):0; renderQuoteBuilder(); }
function qdApplyAll(){ let d=Number(document.getElementById('qd_all').value)||0; if(d<0)d=0; if(d>100)d=100; QD.items.forEach(it=>{ it.disc=d; it.price=Math.round(it.list*(1-d/100)*100)/100; }); renderQuoteBuilder(); }

function statsData(){
  const now=Date.now(), y0=new Date(new Date().getFullYear(),0,1).getTime(), m30=now-30*864e5;
  const from=state.statsPeriod==='m'?m30:state.statsPeriod==='y'?y0:0;
  const orders=state.adminOrders.filter(o=>o.created_at>=from);
  const valid=orders.filter(o=>o.status!=='Annullato');
  const revenue=valid.reduce((s,o)=>s+o.total,0);
  const catOf={}; state.adminProducts.forEach(p=>catOf[p.code]=p.category);
  const byProd={},byClient={},byCat={},byStatus={};
  valid.forEach(o=>{ byClient[o.client_name]=(byClient[o.client_name]||0)+o.total; (o.items||[]).forEach(it=>{ byProd[it.descr]=(byProd[it.descr]||0)+it.qty*it.price; const c=catOf[it.code]||'Altro'; byCat[c]=(byCat[c]||0)+it.qty*it.price; }); });
  orders.forEach(o=>{ byStatus[o.status]=(byStatus[o.status]||0)+1; });
  const months=[]; const d=new Date();
  for(let i=11;i>=0;i--){ const dd=new Date(d.getFullYear(),d.getMonth()-i,1); months.push({key:dd.getFullYear()+'-'+dd.getMonth(),label:dd.toLocaleDateString('it-IT',{month:'short'}),val:0}); }
  valid.forEach(o=>{ const dd=new Date(o.created_at),k=dd.getFullYear()+'-'+dd.getMonth(),m=months.find(x=>x.key===k); if(m)m.val+=o.total; });
  return {orders,valid,revenue,byProd,byClient,byCat,byStatus,months,clients:new Set(valid.map(o=>o.client_id)).size};
}
function topN(obj,n){ return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n); }
function barList(entries,fmt){ const max=Math.max(1,...entries.map(e=>e[1])); return entries.length?entries.map(([k,v])=>`<div class="barrow"><div class="barlab" title="${esc(k)}">${esc(k)}</div><div class="bartrack"><div class="barfill" style="width:${Math.round(v/max*100)}%"></div></div><div class="barval">${fmt(v)}</div></div>`).join(''):'<div class="empty">Nessun dato.</div>'; }

/* ---- Parser user-agent e provenienza (solo lato visualizzazione) ---- */
function parseUA(ua){
  ua=(ua||'').toLowerCase();
  if(!ua) return {browser:'—',os:'—',device:'—'};
  let device='PC';
  if(/ipad|tablet|(android(?!.*mobile))/.test(ua)) device='Tablet';
  else if(/mobile|iphone|ipod|android|windows phone/.test(ua)) device='Smartphone';
  let os='—';
  if(/windows/.test(ua)) os='Windows';
  else if(/iphone|ipad|ios/.test(ua)) os='iOS';
  else if(/mac os x|macintosh/.test(ua)) os='macOS';
  else if(/android/.test(ua)) os='Android';
  else if(/linux/.test(ua)) os='Linux';
  let browser='Altro';
  if(/edg\//.test(ua)) browser='Edge';
  else if(/opr\/|opera/.test(ua)) browser='Opera';
  else if(/samsungbrowser/.test(ua)) browser='Samsung';
  else if(/firefox|fxios/.test(ua)) browser='Firefox';
  else if(/chrome|crios/.test(ua)) browser='Chrome';
  else if(/safari/.test(ua)) browser='Safari';
  return {browser,os,device};
}
function refHost(ref){
  if(!ref) return 'Diretto';
  try{
    const h=new URL(ref).hostname.replace(/^www\./,'');
    if(h===location.hostname||/zetapacksrl/.test(h)) return 'Navigazione interna';
    const map=[['google','Google'],['bing','Bing'],['facebook','Facebook'],['instagram','Instagram'],['l.instagram','Instagram'],['t.co','Twitter/X'],['linkedin','LinkedIn'],['youtube','YouTube'],['whatsapp','WhatsApp'],['duckduckgo','DuckDuckGo'],['yahoo','Yahoo']];
    for(const [k,v] of map) if(h.includes(k)) return v;
    return h;
  }catch(e){ return 'Diretto'; }
}
function devIcon(d){ return d==='Smartphone'?'📱':d==='Tablet'?'▭':d==='PC'?'🖥️':'—'; }

function adminLogsPanel(){
  const now=Date.now(); const from=state.statsPeriod==='m'?now-30*864e5:state.statsPeriod==='y'?new Date(new Date().getFullYear(),0,1).getTime():0;
  let logs=(state.adminLogs||[]).filter(l=>l.ts>=from);
  const f=state.logFilter||'';
  if(f) logs=logs.filter(l=>l.kind===f);
  const anon=logs.filter(l=>l.kind==='anon').length;
  const logins=logs.filter(l=>l.kind==='client'&&l.action==='Login').length;
  // statistiche dispositivi/browser/provenienza sui visitatori (con user-agent)
  const withUA=logs.filter(l=>l.ua);
  const dev={PC:0,Smartphone:0,Tablet:0}; const brow={}; const prov={};
  withUA.forEach(l=>{ const p=parseUA(l.ua); if(dev[p.device]!=null)dev[p.device]++; brow[p.browser]=(brow[p.browser]||0)+1; });
  logs.forEach(l=>{ if(l.kind==='anon'){ const s=refHost(l.ref); prov[s]=(prov[s]||0)+1; } });
  const topBrowser=Object.entries(brow).sort((a,b)=>b[1]-a[1])[0];
  const topProv=Object.entries(prov).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const uniqueIP=new Set(logs.filter(l=>l.kind==='anon'&&l.ip).map(l=>l.ip)).size;
  const shown=logs.slice(0,150);
  const kindPill=k=>k==='anon'?'<span class="st nuovo">Anonimo</span>':k==='admin'?'<span class="st inv">Azienda</span>':'<span class="st evaso">Cliente</span>';
  return `<div class="panel" style="margin-top:16px"><div class="panel-hd"><h3>Visitatori, accessi e attività</h3><div style="flex:1"></div>
      <select class="fsel" onchange="state.logFilter=this.value;render()"><option value="">Tutti</option><option value="anon" ${f==='anon'?'selected':''}>Visitatori anonimi</option><option value="client" ${f==='client'?'selected':''}>Clienti</option><option value="admin" ${f==='admin'?'selected':''}>Azienda</option></select>
      <button class="btn ghost sm" onclick="reloadLogs()">↻ Aggiorna</button></div>
    <div class="kpis" style="margin:14px 18px 0">
      <div class="kpi"><b>${anon}</b><span>Visite anonime</span></div>
      <div class="kpi"><b>${uniqueIP}</b><span>Visitatori unici (IP)</span></div>
      <div class="kpi"><b>${dev.PC}</b><span>Da PC</span></div>
      <div class="kpi"><b>${dev.Smartphone}</b><span>Da smartphone</span></div>
      <div class="kpi"><b>${dev.Tablet}</b><span>Da tablet</span></div>
      <div class="kpi"><b>${logins}</b><span>Accessi clienti</span></div>
    </div>
    <div style="display:flex;gap:22px;flex-wrap:wrap;margin:12px 20px 0;font-size:13px;color:var(--ink-2)">
      <div><b>Browser più usato:</b> ${topBrowser?esc(topBrowser[0])+' ('+topBrowser[1]+')':'—'}</div>
      <div><b>Provenienza visite:</b> ${topProv.length?topProv.map(p=>esc(p[0])+' '+p[1]).join(' · '):'—'}</div>
    </div>
    ${shown.length?`<div class="tbl-scroll" style="max-height:420px;margin-top:12px;overflow:auto"><table class="tbl"><thead><tr><th>Data e ora</th><th>Tipo</th><th>Chi</th><th>Dispositivo</th><th>Browser</th><th>Sistema</th><th>Provenienza</th><th>IP</th><th>Attività</th></tr></thead><tbody>
      ${shown.map(l=>{const p=parseUA(l.ua);return `<tr><td class="mut" style="white-space:nowrap;font-size:12px">${new Date(l.ts).toLocaleString('it-IT')}</td><td>${kindPill(l.kind)}</td><td>${esc(l.who||'—')}</td><td style="white-space:nowrap">${p.device}</td><td>${esc(p.browser)}</td><td class="mut">${esc(p.os)}</td><td class="mut">${esc(refHost(l.ref))}</td><td class="mut" style="font-size:12px;white-space:nowrap">${esc(l.ip||'—')}</td><td>${esc(l.action||'')}${l.detail?' <span class="mut">· '+esc(l.detail)+'</span>':''}</td></tr>`;}).join('')}
    </tbody></table></div>`:'<div class="empty">Nessun accesso registrato nel periodo selezionato.</div>'}
    <div class="mut" style="font-size:11.5px;margin:10px 18px 2px">Gli indirizzi IP sono dati personali: usali solo per statistiche e sicurezza, nel rispetto del GDPR e della tua privacy policy.</div>
  </div>`;
}

      <div id="lerr" style="color:var(--danger);font-size:13px;font-weight:600;margin-bottom:8px"></div>
      <button class="btn primary" style="width:100%;justify-content:center;padding:12px" onclick="doLogin()">Accedi</button>
      <div style="text-align:center;margin-top:14px;font-size:13px" class="mut">Non hai un account? <button style="color:var(--green-d);font-weight:700" onclick="openRequest()">Richiedi accesso</button></div>
    </div>`);
  setTimeout(()=>document.getElementById('lu')?.focus(),60);
}
async function doLogin(){
  const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value;
  try{
    const {token,user}=await api('/api/login',{method:'POST',body:{username:u,password:p}});
    sessionSave(token,user); state.user=user;
    if(user.role==='admin'){ state.view='admin'; state.tab='dash'; await loadAdmin(); }
    else { state.view='client'; state.tab='cat'; state.cart={}; await loadClient(); }
    closeModal(); render(); toast('Accesso effettuato — '+user.name);
  }catch(e){ document.getElementById('lerr').textContent=e.message; }
}
let reqType='Accesso';
function openRequest(){
  reqType='Accesso';
  openModal(`<div class="modal-hd"><h3>Richiedi accesso o listino</h3><p>Lascia i tuoi dati: ti ricontattiamo per attivare l'account cliente o inviarti il listino completo di imballaggi e monouso. È gratuito e senza impegno.</p></div>
    <div class="modal-body">
      <div class="seg" id="seg"><button class="on" onclick="setReqType('Accesso',this)">Voglio accedere</button><button onclick="setReqType('Listino',this)">Ricevere il listino</button><button onclick="setReqType('Nuovo cliente',this)">Diventare cliente</button></div>
      <div class="field"><label>Ragione sociale / attività *</label><input id="rc"></div>
      <div class="row2"><div class="field"><label>Referente *</label><input id="rn"></div><div class="field"><label>P.IVA</label><input id="rv"></div></div>
      <div class="row2"><div class="field"><label>Email *</label><input id="re" type="email"></div><div class="field"><label>Telefono</label><input id="rp"></div></div>
      <div class="field"><label>Messaggio</label><textarea id="rm"></textarea></div>
      <div id="rerr" style="color:var(--danger);font-size:13px;font-weight:600;margin-bottom:8px"></div>
      <button class="btn primary" style="width:100%;justify-content:center;padding:12px" onclick="submitRequest()">Invia richiesta</button>
    </div>`);
}
function setReqType(t,btn){ reqType=t; [...document.getElementById('seg').children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
async function submitRequest(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('rc')||!g('rn')||!g('re')){ document.getElementById('rerr').textContent='Compila attività, referente ed email.'; return; }
  try{ await api('/api/requests',{method:'POST',body:{type:reqType,company:g('rc'),name:g('rn'),vat:g('rv'),email:g('re'),phone:g('rp'),msg:g('rm')}});
    closeModal(); toast('Richiesta inviata ✓ Ti ricontattiamo a breve');
  }catch(e){ document.getElementById('rerr').textContent=e.message; }
}

/* ---------------- misc ---------------- */
const ORDER_STEPS=['Nuovo','In lavorazione','Spedito','Fatturato','Evaso'];
function stClass(s){ return {'Nuovo':'nuovo','In lavorazione':'lav','Spedito':'spd','Fatturato':'inv','Evaso':'evaso','Annullato':'ann'}[s]||'nuovo'; }
function quoteCls(s){ return {'Bozza':'nuovo','Inviato':'lav','Accettato':'evaso','Rifiutato':'ann','Scaduto':'ann'}[s]||'nuovo'; }
function progressStepper(status){
  if(status==='Annullato') return `<div class="progcanc">✕ Ordine annullato</div>`;
  const idx=ORDER_STEPS.indexOf(status), cur=idx<0?0:idx;
  return `<div class="prog">${ORDER_STEPS.map((s,i)=>`<div class="pstep ${i<cur?'done':''} ${i===cur?'now':''}"><span class="pdot">${i<cur?'✓':i+1}</span><span class="plab">${s}</span></div>`).join('')}</div>`;
}
function docsLine(o, side){
  const s=side||'client'; const parts=[];
  if(o.ddt_num||o.ddt_file){ let t='📄 DDT'; if(o.ddt_num)t+=' '+esc(o.ddt_num); if(o.ddt_date)t+=' del '+esc(o.ddt_date); if(o.ddt_file)t+=` <button class="linkx" onclick="downloadOrderFile('${o.id}','ddt','${s}')">⤓ scarica</button>`; parts.push(t); }
  if(o.invoice_num||o.invoice_file){ let t='🧾 Fattura'; if(o.invoice_num)t+=' '+esc(o.invoice_num); if(o.invoice_date)t+=' del '+esc(o.invoice_date); if(o.invoice_file)t+=` <button class="linkx" onclick="downloadOrderFile('${o.id}','invoice','${s}')">⤓ scarica</button>`; parts.push(t); }
  if(!parts.length) return '';
  return `<div class="mut" style="font-size:12px;margin:2px 0 8px">${parts.join(' · ')}</div>`;
}
function logout(){ sessionClear(); state.user=null; state.view='public'; state.tab=''; state.cart={}; state.filter={q:'',cat:'',sector:''};
  api('/api/catalog').then(c=>{ state.catalog=c; render(); }).catch(()=>render()); }
// Anteprima: l'amministratore vede il sito come un visitatore ('public') o un cliente registrato ('client'), senza uscire.
async function previewAs(mode){
  try{
    state._bak={ tab:state.tab, catalog:state.catalog, promo:state.promo, filter:state.filter, cart:state.cart };
    state.filter={q:'',cat:'',sector:''}; state.page=1;
    if(mode==='client'){
      const cat=await api('/api/catalog/prices');
      state.catalog=cat; state.cart={}; state.preview='client'; state.view='client'; state.tab='cat';
    } else {
      const [cat,promo]=await Promise.all([api('/api/catalog'), api('/api/promo').catch(()=>[])]);
      state.catalog=cat; state.promo=promo||[]; state.preview='public'; state.view='public'; state.tab='';
    }
    render(); try{window.scrollTo(0,0);}catch(e){}
  }catch(e){ toast(e.message||'Anteprima non disponibile'); }
}
function exitPreview(){
  const b=state._bak;
  if(b){ state.catalog=b.catalog; state.promo=b.promo; state.tab=b.tab||'dash'; state.filter=b.filter||{q:'',cat:'',sector:''}; state.cart=b.cart||{}; state._bak=null; }
  state.preview=null; state.view='admin'; if(!state.tab) state.tab='dash';
  render(); try{window.scrollTo(0,0);}catch(e){}
}
let toastT; function toast(m){ document.getElementById('toastmsg').textContent=m; const t=document.getElementById('toast'); t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3200); }
function footer(){ return `<footer class="ftr"><div class="wrap"><div><b style="font-family:var(--disp);color:var(--ink)">ZETAPACK Srl</b> · Imballaggi, monouso, packaging alimentare e igiene professionale per bar, ristoranti, negozi e attività a Verona e Rovereto</div><div>Portale ordini & preventivi · v${APP_VERSION} · ${BUILD_DATE}</div></div></footer>`; }

init();
</script>
